version: "3.8"

services:
  n8n:
    image: n8nio/n8n:1.70.3
    container_name: inboxd-n8n-local
    restart: unless-stopped
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ../data:/data:ro
    env_file:
      - ../.env
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - OLLAMA_HOST=http://ollama:11434
      - QDRANT_HOST=http://qdrant:6333
    networks:
      - inboxd
    depends_on:
      - ollama
      - qdrant

  ollama:
    image: ollama/ollama:0.5.4
    container_name: inboxd-ollama
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - inboxd
    ports:
      - "11434:11434"

  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: inboxd-qdrant
    restart: unless-stopped
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - inboxd
    ports:
      - "6333:6333"
      - "6334:6334"

volumes:
  n8n_data:
    driver: local
  ollama_models:
    driver: local
  qdrant_storage:
    driver: local

networks:
  inboxd:
    driver: bridge
