name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate cloud workflow JSON
        run: python3 -c "import json; json.load(open('workflows/cloud/workflow.json')); print('Cloud workflow JSON: VALID')"

      - name: Validate local workflow JSON
        run: python3 -c "import json; json.load(open('workflows/local/workflow.json')); print('Local workflow JSON: VALID')"

      - name: Run prompt sync check
        run: python3 scripts/check_prompt_sync.py
